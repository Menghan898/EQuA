name: README-sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: website

      - name: Rebuild README
        shell: Rscript {0}
        run: devtools::build_readme()

      - name: Require committed README output
        # PNG rendering differs across operating systems even when the source
        # and README text are identical, so only the rendered Markdown is a
        # stable synchronization check.
        run: git diff --exit-code -- README.md
